name: CI

# Roda em todo PR e em push na main. Nada aqui publica: a Vercel publica a tela
# sozinha; banco e edge functions seguem manuais (README).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifica:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # O build não fala com o Supabase; os valores só precisam existir.
    env:
      VITE_SUPABASE_URL: https://e2e-mock.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: e2e-anon-key
      VITE_SUPABASE_PROJECT_ID: e2e-mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm test
      - run: npm run build

  e2e:
    name: Ponta a ponta (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verifica
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
