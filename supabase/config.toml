project_id = "mxouphopjfoxtfxpfnde"

[auth]
enabled = true
# Base dos links de confirmação e de recuperação de senha. Sem isto o Supabase
# assume localhost:3000 e todo e-mail sai com link quebrado.
site_url = "https://oxyve.vercel.app"
# O app monta os redirects com window.location.origin (AuthContext.tsx:240,253,268),
# então cada origem de onde ele roda precisa estar liberada aqui — incluindo os
# previews de PR da Vercel, que têm subdomínio novo a cada deploy.
additional_redirect_urls = [
  "https://oxyve.vercel.app/**",
  "https://*-o2-inc-s-projects.vercel.app/**",
  "http://localhost:5173/**",
  "http://localhost:8080/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# Confirmação segue obrigatória de propósito: handle_new_user faz auto-join pelo
# domínio em org_domains, então sem confirmar e-mail qualquer um que saiba o
# domínio entraria na organização como employee.
enable_confirmations = true
secure_password_change = true
# Restaura o que o projeto já tinha: o config push do CLI reescreve com os
# defaults dele todo campo não declarado aqui.
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.send-email]
verify_jwt = true

[functions.validate-receipt]
verify_jwt = true
