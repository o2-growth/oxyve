project_id = "mxouphopjfoxtfxpfnde"

[auth]
enabled = true
# Base dos links de confirmação e de recuperação de senha. Sem isto o Supabase
# assume localhost:3000 e todo e-mail sai com link quebrado.
site_url = "https://oxyve.vercel.app"
# O app monta os redirects com window.location.origin (AuthContext.tsx:240,253,268),
# então cada origem de onde ele roda precisa estar liberada aqui — incluindo os
# previews de PR da Vercel, que têm subdomínio novo a cada deploy.
additional_redirect_urls = [
  "https://oxyve.vercel.app/**",
  "https://*-o2-inc-s-projects.vercel.app/**",
  "http://localhost:5173/**",
  "http://localhost:8080/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

# Login só com Google da O2 Inc. O provider de e-mail/senha fica desligado (no
# CLI, enable_signup aqui é o external_email_enabled do projeto): sem ele, não há
# senha para vazar nem e-mail de confirmação dependendo de SMTP.
[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
# Restaura o que o projeto já tinha: o config push do CLI reescreve com os
# defaults dele todo campo não declarado aqui.
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

# Trava de domínio no servidor: recusa a criação de usuário cujo e-mail não está
# em org_domains, qualquer que seja o provider. O `hd` que o front manda ao
# Google é só filtro de UI. Função em 20260924170000_login_so_dominio_o2inc.sql.
[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/hook_restringe_dominio"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.send-email]
verify_jwt = true

[functions.validate-receipt]
verify_jwt = true
